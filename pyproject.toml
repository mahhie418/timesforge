[project]
name = "timesforge"
version = "0.1.0"
description = "Create a times channel for each member of a Slack workspace from App Home."
readme = "README.md"
authors = [
    { name = "Mahiro Sakaue", email = "mahhie418@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C90", "CPY", "EM", "INP", "TC", "TRY",
    "COM812", "D201", "D202", "D211", "E501", "E701", "PTH118"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "PLR2004", "S101"
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ty.environment]
extra-paths = ["scripts"]
